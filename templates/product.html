<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titleText}} | Tyler Manufacturing Shop</title>
<meta name="description" content="{{metaDescription}}">
<link rel="canonical" href="{{url}}">
<!-- BUILD:head -->
<!-- /BUILD:head -->
<script type="application/ld+json">

</script>

<!-- BUILD:header -->
<!-- /BUILD:header -->
<main id="main">

      <h1>{{name}}</h1>
      {{fitsBlock}}
      <p class="price">{{price}}</p>
      <p>{{shortDescription}}</p>
      <div class="buy">{{buyButton}}</div>
      <p class="ship-line">{{shippingLine}}</p>
      <p class="policy-links"><a href="/shop/shipping/">Shipping</a> &middot; <a href="/shop/returns/">Returns</a></p>
      <h2 class="details-title">Details</h2>
      <p>{{description}}</p>
      <table class="spec-table">
        <caption class="details-caption">Key specs</caption>
        <tbody>
{{specRows}}
        </tbody>
      </table>
    </div>
  </div>
