    <mask id="tm-o3-plate">
      <rect y="0" width="320" height="100" fill="#fff"/>
      <circle cx="24" cy="77" r="3.5" fill="#000"/>
      <circle cx="296" cy="77" r="3.5" fill="#000"/>
